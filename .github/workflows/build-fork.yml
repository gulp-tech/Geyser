name: Build Geyser fork

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/ce260261-geyser"
      - master
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (no daemon)
        run: ./gradlew assemble --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload jars
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Geyser-jars
          if-no-files-found: warn
          path: |
            bootstrap/spigot/build/libs/Geyser-Spigot.jar
            bootstrap/standalone/build/libs/Geyser-Standalone.jar
            bootstrap/velocity/build/libs/Geyser-Velocity.jar
            bootstrap/bungeecord/build/libs/Geyser-BungeeCord.jar
            bootstrap/mod/fabric/build/libs/Geyser-Fabric.jar
            bootstrap/mod/neoforge/build/libs/Geyser-NeoForge.jar
            bootstrap/viaproxy/build/libs/Geyser-ViaProxy.jar

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
